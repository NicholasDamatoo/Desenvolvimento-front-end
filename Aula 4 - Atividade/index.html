<!DOCTYPE html>
<html lang="pt-br">
    <head> 
        <title>Diário</title>
        <meta charset="UTF-8">
    </head>
    <body> 
        <header>
            <h1>Meu Diário</h1>
        </header>

        <main>
            <section>
                <h2>Deixe um registro da sua história</h2>

                <form action="https://postman-echo.com/post" method="post" enctype="multipart/form-data">

                    <p>Preencha o formulário abaixo para registrar um momento do seu dia</p>

                    <fieldset>
                        <legend>Dados do Registro</legend>

                        <div>
                            <label for="foto_id">Foto:</label>
                            <input id="foto_id" name="foto" type="file" accept="image/*">
                        </div>

                        <div>
                            <label for="nome_id">Nome:</label>
                            <input id="nome_id" name="nome" type="text" placeholder="Seu nome">
                        </div>

                        <div>
                            <label for="data_nasc_id">Data:</label>
                            <input id="data_nasc_id" name="data_nasc" type="date">
                        </div>

                        <fieldset>
                            <legend>Local</legend>

                            <div>
                                <label for="logradouro_id">Lugar:</label>
                                <input id="logradouro_id" name="logradouro" type="text">
                            </div>

                            <div>
                                <label for="cidade_id">Cidade-UF:</label>
                                <input id="cidade_id" name="cidade" type="text">
                            </div>

                            <div>
                                <label for="numero_id">Número:</label>
                                <input id="numero_id" name="numero" type="number">
                            </div>

                        </fieldset>
                    </fieldset>

                    <fieldset>
                        <legend>Meu Dia</legend>

                        <div>
                            <label for="resumo_id">Conte como foi seu dia:</label>
                            <textarea id="resumo_id" name="resumo"></textarea>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Como estou me sentindo</legend>

                        <div>
                            <input id="nivel_estagio_id"
                                   name="nivel"
                                   type="radio"
                                   value="feliz">
                            <label for="nivel_estagio_id">Feliz</label>
                        </div>

                        <div>
                            <input id="nivel_junior_id"
                                   name="nivel"
                                   type="radio"
                                   value="triste">
                            <label for="nivel_junior_id">Triste</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>O que marcou meu dia:</legend>

                        <div>
                            <input id="tec_html_id"
                                   name="tecnologias"
                                   type="checkbox"
                                   value="familia">
                            <label for="tec_html_id">Família</label>
                        </div>

                        <div>
                            <input id="tec_css_id"
                                   name="tecnologias"
                                   type="checkbox"
                                   value="amigos">
                            <label for="tec_css_id">Amigos</label>
                        </div>

                        <div>
                            <input id="tec_js_id"
                                   name="tecnologias"
                                   type="checkbox"
                                   value="estudos">
                            <label for="tec_js_id">Estudos</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Momento do dia:</legend>

                        <div>
                            <label for="escolaridade_id">Período:</label>

                            <select id="escolaridade_id" name="escolaridade">
                                <option value="manha">Manhã</option>
                                <option value="tarde">Tarde</option>
                                <option value="noite">Noite</option>
                            </select>
                        </div>
                    </fieldset>

                    <div>
                        <button type="reset">Limpar dados</button>
                        <button type="submit">Salvar registro</button>
                    </div>

                </form>
            </section>
        </main>

        <footer>
            <p>Todos os direitos reservados</p>
        </footer>
    </body>
</html>
